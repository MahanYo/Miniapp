<div class="page active" id="page-explore">
    
    <!-- ===== پنل مدیریت (فقط برای ادمین) ===== -->
    <div id="adminPanel" class="admin-panel hidden" style="background:var(--bg-secondary);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid rgba(255,215,0,0.15);">
        <div class="panel-header" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:0.5px solid var(--border-color);">
            <i class="ph-fill ph-gear" style="font-size:20px;color:#ffd700;"></i>
            <h3 style="font-size:15px;font-weight:700;color:#ffd700;">پنل مدیریت</h3>
            <span class="badge" style="font-size:9px;background:rgba(255,215,0,0.12);color:#ffd700;padding:2px 10px;border-radius:30px;font-weight:600;">ادمین</span>
        </div>

        <div class="stats-row" style="display:flex;gap:8px;margin-bottom:12px;">
            <div class="stat-box" style="flex:1;background:var(--bg-primary);border-radius:var(--radius-sm);padding:10px;text-align:center;">
                <div class="number" id="statPosts" style="font-size:18px;font-weight:800;color:#ffd700;">0</div>
                <div class="label" style="font-size:10px;color:var(--text-muted);margin-top:2px;">پست</div>
            </div>
            <div class="stat-box" style="flex:1;background:var(--bg-primary);border-radius:var(--radius-sm);padding:10px;text-align:center;">
                <div class="number" id="statLikes" style="font-size:18px;font-weight:800;color:#ffd700;">0</div>
                <div class="label" style="font-size:10px;color:var(--text-muted);margin-top:2px;">لایک</div>
            </div>
            <div class="stat-box" style="flex:1;background:var(--bg-primary);border-radius:var(--radius-sm);padding:10px;text-align:center;">
                <div class="number" id="statComments" style="font-size:18px;font-weight:800;color:#ffd700;">0</div>
                <div class="label" style="font-size:10px;color:var(--text-muted);margin-top:2px;">کامنت</div>
            </div>
        </div>

        <div class="upload-wrap" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
            <button class="upload-btn" id="uploadBtn" style="padding:10px 16px;border:1px dashed var(--border-color);border-radius:var(--radius-sm);background:transparent;color:var(--text-primary);font-size:13px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:6px;flex:1;justify-content:center;">
                <i class="ph ph-image"></i> انتخاب عکس
            </button>
            <div class="upload-preview" id="uploadPreview" style="width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;border:0.5px solid var(--border-color);flex-shrink:0;display:none;position:relative;">
                <img id="previewImg" src="" style="width:100%;height:100%;object-fit:cover;">
                <button class="remove" id="removeImg" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff4757;color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
            </div>
        </div>

        <input class="admin-input" id="postImage" placeholder="🔗 یا لینک عکس" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:var(--radius-sm);border:0.5px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);-webkit-user-select:text;user-select:text;display:none;">
        <input class="admin-input" id="postTitle" placeholder="📌 عنوان فیلم" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:var(--radius-sm);border:0.5px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);-webkit-user-select:text;user-select:text;">
        <input class="admin-input" id="postCategory" placeholder="🏷 ژانر" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:var(--radius-sm);border:0.5px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);-webkit-user-select:text;user-select:text;">
        <textarea class="admin-input" id="postDesc" rows="2" placeholder="✍ توضیحات" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:var(--radius-sm);border:0.5px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);-webkit-user-select:text;user-select:text;font-family:inherit;resize:vertical;"></textarea>
        <input class="admin-input" id="postLink" placeholder="🔗 لینک دانلود" style="width:100%;padding:10px 12px;margin-bottom:8px;border-radius:var(--radius-sm);border:0.5px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);-webkit-user-select:text;user-select:text;">

        <button class="admin-btn" id="publishBtn" style="width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:#ffd700;color:#0a0a1a;font-weight:700;font-size:14px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;">
            <i class="ph ph-plus-circle"></i> انتشار
        </button>
        <button class="admin-btn secondary hidden" id="updateBtn" style="width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--border-color);color:var(--text-primary);font-weight:700;font-size:14px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;">
            <i class="ph ph-arrows-clockwise"></i> بروزرسانی
        </button>

        <div id="adminStatus" class="admin-status" style="margin-top:8px;font-size:12px;text-align:center;color:var(--text-muted);"></div>
    </div>

    <!-- ===== لیست پست‌ها ===== -->
    <div id="postsContainer">
        <div class="loading" style="text-align:center;padding:30px 0;color:var(--text-muted);">
            <i class="ph-fill ph-spinner" style="font-size:28px;display:block;margin-bottom:10px;animation:spin 1s linear infinite;"></i>
            در حال بارگذاری...
        </div>
    </div>

</div>

<style>
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
