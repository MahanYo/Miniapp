<div class="page" id="page-settings">
    <h3 style="margin-bottom:16px;"><i class="ph-fill ph-gear" style="color:var(--accent);"></i> تنظیمات</h3>
    
    <div class="settings-item" onclick="changeTheme('dark')" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border-color);cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;"><i class="ph ph-moon" style="font-size:18px;color:var(--accent);"></i> <span>تم تاریک</span></div>
        <div class="theme-option active" style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border-color);background:#0d0d0d;" id="theme-dark"></div>
    </div>
    
    <div class="settings-item" onclick="changeTheme('light')" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border-color);cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;"><i class="ph ph-sun" style="font-size:18px;color:var(--accent);"></i> <span>تم روشن</span></div>
        <div class="theme-option" style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border-color);background:#f7f7f8;" id="theme-light"></div>
    </div>

    <div class="settings-item" onclick="setBackground()" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border-color);cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;"><i class="ph ph-image" style="font-size:18px;color:var(--accent);"></i> <span>پس‌زمینه</span></div>
        <div style="color:var(--text-muted);font-size:14px;">انتخاب</div>
    </div>

    <div class="settings-item" onclick="changeLanguage()" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border-color);cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;"><i class="ph ph-translate" style="font-size:18px;color:var(--accent);"></i> <span>زبان</span></div>
        <div style="color:var(--text-muted);font-size:14px;" id="langDisplay">فارسی</div>
    </div>

    <div class="settings-item" onclick="openSupport()" style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:0.5px solid var(--border-color);cursor:pointer;">
        <div style="display:flex;align-items:center;gap:10px;"><i class="ph ph-headset" style="font-size:18px;color:var(--accent);"></i> <span>پشتیبانی</span></div>
        <div style="color:var(--text-muted);font-size:14px;"><i class="ph ph-caret-left"></i></div>
    </div>
</div>
