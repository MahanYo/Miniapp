<div class="page" id="page-profile">
    <div style="text-align:center;padding:20px 0;">
        <div style="width:80px;height:80px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:2px solid var(--accent);cursor:pointer;" onclick="openProfileEdit()">
            <img id="profileAvatarImg" src="" style="width:100%;height:100%;object-fit:cover;background:var(--accent);">
        </div>
        <h2 style="font-size:18px;" id="profileName">کاربر</h2>
        <p style="color:var(--text-muted);font-size:13px;" id="profileId">@unknown</p>
        <p style="color:var(--text-secondary);font-size:12px;margin:8px 0;" id="profileBio">بیوگرافی خود را وارد کنید</p>
        <div style="display:flex;justify-content:center;gap:24px;margin:16px 0;">
            <div><div style="font-size:20px;font-weight:700;" id="profilePosts">0</div><div style="font-size:11px;color:var(--text-muted);">پست</div></div>
            <div><div style="font-size:20px;font-weight:700;" id="profileLikes">0</div><div style="font-size:11px;color:var(--text-muted);">لایک</div></div>
        </div>
        <button onclick="openProfileEdit()" style="background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius-full);font-weight:600;cursor:pointer;">
            <i class="ph ph-pencil"></i> ویرایش پروفایل
        </button>
        <button onclick="clearAllData()" style="background:transparent;color:#ff4757;border:0.5px solid #ff4757;padding:10px 24px;border-radius:var(--radius-full);font-weight:600;cursor:pointer;margin-top:12px;">
            <i class="ph ph-trash"></i> پاک کردن داده‌ها
        </button>
    </div>
</div>
